[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-india"
version = "0.1.0"
description = "End-to-end quant trading system for Indian equities with Zerodha Kite Connect integration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Quant Engineering Assistant"}
]
dependencies = [
    "aiohttp>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.4.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.9.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "plotly>=5.18.0",
    "streamlit>=1.28.0",
    "fastparquet>=2023.10.0",
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "spacy>=3.7.0",
    "beautifulsoup4>=4.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.5",
    "mypy>=1.6.0",
    "types-requests",
    "types-PyYAML"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["quant_india/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
